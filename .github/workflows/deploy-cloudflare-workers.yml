name: Deploy to Cloudflare Workers

# Manual trigger is enabled so this deployment can be started from Actions.
# This workflow builds the app, runs tests, and deploys static assets via Wrangler.
on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: toolzi-cloudflare-workers-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Toolzi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Workflow overview
        run: |
          echo "=== Toolzi Cloudflare deploy ==="
          echo "Branch: $GITHUB_REF"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Run number: $GITHUB_RUN_NUMBER"
          echo "Repository: $GITHUB_REPOSITORY"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Deploy Worker static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
